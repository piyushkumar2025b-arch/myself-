    <script>
      (function() {
        function isIgnorableExtensionError(msg, filename, stack) {
          var str = ((msg || '') + ' ' + (filename || '') + ' ' + (stack || '')).toLowerCase();
          return (
            str.indexOf('metamask') !== -1 ||
            str.indexOf('ethereum') !== -1 ||
            str.indexOf('web3') !== -1 ||
            str.indexOf('chrome-extension://') !== -1 ||
            str.indexOf('moz-extension://') !== -1 ||
            str.indexOf('safari-web-extension://') !== -1
          );
        }

        window.addEventListener('error', function(event) {
          var msg = event.message || (event.error && event.error.message) || '';
          var file = event.filename || '';
          var stack = (event.error && event.error.stack) || '';
          if (isIgnorableExtensionError(msg, file, stack)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
          var stack = (reason && reason.stack) || '';
          if (isIgnorableExtensionError(msg, '', stack)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
